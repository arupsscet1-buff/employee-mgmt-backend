name: Employee Management System Frontend
description: This is the frontend application for the Employee Management System, built using React.

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    id-token: write
    contents: read
    security-events: write
    actions: read
    packages: read

env:
    JAVA_VERSION: 17
    SERVICE_NAME: backend-app
    AWS_REGION: ap-south-1
    IMAGE_NAME: ${{ vars.REGISTRY_URL }}/backend-app
    IMAGE_TAG: ${{ github.sha }}


jobs:
    build-test-scan:
        name: Build, Test and Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: ${{ env.JAVA_VERSION }}
                cache: maven

            - name: Gitleaks Secret Scan
              uses: gitleaks/gitleaks-action@v3

            - name: Compile and Test
              run: mvn compile test
            
            # - name: SonarQube scan
            #   # Never expose SonarQube credentials to forked PRs.
            #   if: >
            #     github.event_name == 'push' &&
            #     github.ref == 'refs/heads/main'
            #   uses: SonarSource/sonarqube-scan-action@v5
            #   env:
            #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

            # - name: Enforce SonarQube quality gate
            #   if: >
            #     github.event_name == 'push' &&
            #     github.ref == 'refs/heads/main'
            #   uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
            #   with:
            #     pollingTimeoutSec: 600
            #   env:
            #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    analyze:
      name: CodeQL Analysis
      runs-on: ubuntu-latest
      needs: build-test-scan
      if: needs.build-test-scan.result == 'success'

      steps:
        - name: Checkout source code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: Setup JDK
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: ${{ env.JAVA_VERSION }}
            cache: maven

        - name: Initialize CodeQL
          uses: github/codeql-action/init@v4
          with:
            languages: java-kotlin
            dependency-caching: true

        - name: Compile Code
          run: mvn compile

        - name: Analyze
          uses: github/codeql-action/analyze@v4

    Dependency-Check-DB:
      name: Update and Cache OWASP Database
      runs-on: ubuntu-latest
      needs: build-test-scan
      if: needs.build-test-scan.result == 'success'

      steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Setup Java
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '${{ env.JAVA_VERSION }}'
            cache: maven

        - name: Generate cache key
          id: cache-key
          run: |
            echo "key=dependency-check-${{ runner.os }}-$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"

        - name: Restore existing Dependency-Check database
          uses: actions/cache/restore@v4
          with:
            path: ${{ github.workspace }}/.dependency-check
            key: ${{ steps.cache-key.outputs.key }}
            restore-keys: |
              dependency-check-${{ runner.os }}-

        # - name: Test NVD API rate behavior
        #   env:
        #     NVD_API_KEY: ${{ secrets.OWASP_NVD_API_KEY }}
        #   run: |
        #     for i in {1..5}; do
        #       echo "Request $i"

        #       curl -sS \
        #         -o /tmp/nvd-$i.json \
        #         -w "HTTP %{http_code}\n" \
        #         -H "apiKey: ${NVD_API_KEY}" \
        #         "https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=2000"

        #       sleep 6
        #     done

        - name: Update NVD database
          env:
            NVD_API_KEY: ${{ secrets.OWASP_NVD_API_KEY }}
          run: >
            mvn --batch-mode
            org.owasp:dependency-check-maven:12.2.2:update-only
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
            -DdataDirectory=${{ github.workspace }}/.dependency-check
            -DnvdApiDelay=6000
            -DnvdApiResultsPerPage=2000
            -DnvdMaxRetryCount=20

        - name: Save Dependency-Check database
          uses: actions/cache/save@v4
          with:
            path: ${{ github.workspace }}/.dependency-check
            key: ${{ steps.cache-key.outputs.key }}

    SCA-Scan:
      name: Scan Third Party Dependencies
      runs-on: ubuntu-latest

      needs:
        - build-test-scan
        - Dependency-Check-DB

      if: |
        needs.build-test-scan.result == 'success' &&
        needs.Dependency-Check-DB.result == 'success'

      steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Setup Java
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '${{ env.JAVA_VERSION }}'
            cache: maven

        - name: Generate cache key
          id: cache-key
          run: |
            echo "key=dependency-check-${{ runner.os }}-$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"

        - name: Restore Dependency-Check database
          uses: actions/cache/restore@v4
          with:
            path: ${{ github.workspace }}/.dependency-check
            key: ${{ steps.cache-key.outputs.key }}
            restore-keys: |
              dependency-check-${{ runner.os }}-

        - name: OWASP Dependency-Check
          env:
            NVD_API_KEY: ${{ secrets.OWASP_NVD_API_KEY }}
          run: >
            mvn --batch-mode --no-transfer-progress
            org.owasp:dependency-check-maven:12.2.2:aggregate
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
            -DdataDirectory=${{ github.workspace }}/.dependency-check
            -DfailBuildOnCVSS=10
            -Dformats=HTML,JSON
            -Dodc.outputDirectory=target/dependency-check

        - name: Upload OWASP report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: owasp-dependency-check-${{ github.run_id }}
            path: target/dependency-check/**
            if-no-files-found: warn
            retention-days: 14

    File-System-Scan:
        name: Run trivy file system scan to scan configuration misconfguration. 
        needs: build-test-scan
        runs-on: ubuntu-latest
        if: needs.build-test-scan.result == 'success'
        steps:
            - name: Checkout source code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Scan repository with Trivy
              uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
              with:
                scan-type: fs
                scan-ref: .
                scanners: vuln,secret,misconfig
                severity: CRITICAL
                ignore-unfixed: true
                exit-code: "1"

    Build-Artifact:
        name: Package application and store the artifact to jfrog artifactory
        needs: [build-test-scan,analyze,SCA-Scan,File-System-Scan]
        if: needs.build-test-scan.result=='success' && needs.analyze.result=='success' && needs.SCA-Scan.result=='success' && needs.File-System-Scan.result=='success'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Build and Package application source code
              run: mvn clean verify

            - name: Upload tested config-server JAR
              uses: actions/upload-artifact@v4
              with:
                name: backend-app-${{ github.run_id }}
                path: target/spring-boot-backend*.jar
                if-no-files-found: error
                retention-days: 1

    Build-Image-Publish:
        name: Build, Scan and Publish container Image
        needs: [analyze,File-System-Scan,SCA-Scan,Build-Artifact]
        runs-on: ubuntu-latest
        if: |
          always() &&
          needs.analyze.result == 'success' &&
          (needs.File-System-Scan.result == 'success' && needs.SCA-Scan.result == 'success' && needs.Build-Artifact.result == 'success' ) &&
          github.event_name == 'push'

        steps:
            - name: Configure AWS credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::748624204530:role/github-actions-role
                aws-region: ${{ env.AWS_REGION }}

            - name: Verify AWS identity
              run: aws sts get-caller-identity

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Checkout source code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: checking path
              run: ls -la

            - name: Download tested Artifact
              uses: actions/download-artifact@v4
              with:
                name: backend-app-${{ github.run_id }}
                path: target/

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: checking path
              run: ls -la

            - name: Inspect backend JAR
              run: |
                ls -lh target/
                file target/*.jar
                tar -zvf -t target/*.jar
            
            - name: Build image locally for scanning
              uses: docker/build-push-action@v6
              with:
                context: .
                file: Dockerfile
                load: true
                push: false
                tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
                cache-from: type=gha
                cache-to: type=gha,mode=max     
            
            - name: Block vulnerable image publication
              uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
              with:
                scan-type: image
                image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
                severity: CRITICAL
                ignore-unfixed: true
                exit-code: "1"

            - name: Publish immutable commit image with SBOM and provenance
              id: publish
              uses: docker/build-push-action@v6
              with:
                aws_role_to_assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
                aws_default_region: ${{ env.AWS_REGION}}
                context: .
                file: Dockerfile
                push: true
                tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
                labels: |
                  org.opencontainers.image.revision=${{ github.sha }}
                  org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                  org.opencontainers.image.version=${{ github.sha }}
                provenance: mode=max
                sbom: true
                cache-from: type=gha
